name: build

on:
  push:
    branches: [ master, Subscribe ]
  pull_request:
    branches: [ master, Subscribe ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DisCache.sln

      - name: Build
        run: dotnet build DisCache.sln --configuration Release --no-restore